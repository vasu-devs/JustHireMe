name: JustHireMe
options:
  bundleIdPrefix: com.justhireme
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    # The App Store version. The build number (CURRENT_PROJECT_VERSION) is set per archive by
    # ios/scripts/archive-release.sh so every TestFlight upload is unique.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  JustHireMe:
    type: application
    platform: iOS
    sources: [JustHireMe]
    preBuildScripts:
      - name: Prepare opaque brand icon
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            python3 "$SRCROOT/../scripts/validate-mobile.py" --release
          fi
          xcrun swift -sdk "$(xcrun --sdk macosx --show-sdk-path)" "$SRCROOT/scripts/prepare-icon.swift" "$SRCROOT/Branding.png" "$SRCROOT/JustHireMe/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justhireme.mobile
        INFOPLIST_FILE: JustHireMe/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Automatic signing; the team is supplied by the archive script (DEVELOPMENT_TEAM) so the
        # simulator CI stays unsigned and no Apple identity is committed.
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  JustHireMeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [JustHireMeTests]
    dependencies:
      - target: JustHireMe
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  JustHireMeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [JustHireMeUITests]
    dependencies:
      - target: JustHireMe
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  JustHireMe:
    build:
      targets:
        JustHireMe: all
    test:
      targets: [JustHireMeTests, JustHireMeUITests]
    archive:
      config: Release
